- model: scanEngine.enginetype
  pk: 1
  fields:
    engine_name: Full Scan
    yaml_configuration: "subdomain_discovery: {\r\n  'uses_tools': ['sublist3r',
      'oneforall'],\r\n  'enable_http_crawl': true,\r\n  'threads': 30,\r\n  'timeout':
      5,\r\n}\r\nhttp_crawl: {}\r\nport_scan: {\r\n  'enable_http_crawl': true,\r\n
      \ 'timeout': 5,\r\n  'ports': ['top-100'],\r\n  'rate_limit': 150,\r\n  'threads':
      30,\r\n  'passive': false,\r\n}\r\nosint: {\r\n  'discover': [\r\n      'emails',\r\n
      \     'metainfo',\r\n      'employees'\r\n    ],\r\n  'dorks': [\r\n    'login_pages',\r\n
      \   'admin_panels',\r\n    'dashboard_pages',\r\n    'stackoverflow',\r\n    'social_media',\r\n
      \   'project_management',\r\n    'code_sharing',\r\n    'config_files',\r\n
      \   'jenkins',\r\n    'wordpress_files',\r\n    'php_error',\r\n    'exposed_documents',\r\n
      \   'db_files',\r\n    'git_exposed'\r\n  ],\r\n  'intensity': 'normal',\r\n
      \ 'documents_limit': 50\r\n}\r\ndir_file_fuzz: {\r\n  'auto_calibration': true,\r\n
      \ 'enable_http_crawl': true,\r\n  'rate_limit': 150,\r\n  'extensions': [],\r\n
      \ 'follow_redirect': false,\r\n  'max_time': 0,\r\n  'match_http_status': [200,
      204],\r\n  'recursive_level': 2,\r\n  'stop_on_error': false,\r\n  'timeout':
      5,\r\n  'threads': 30,\r\n  'wordlist_name': 'dicc'\r\n}\r\nfetch_url: {\r\n
      \ 'uses_tools': ['katana', 'gau'],\r\n  'remove_duplicate_endpoints': true,\r\n
      \ 'duplicate_fields': ['content_length', 'page_title'],\r\n  'enable_http_crawl':
      true,\r\n  'ignore_file_extensions': ['png', 'jpg', 'jpeg', 'gif', 'mp4',
      'mpeg', 'mp3'],\r\n  'threads': 30\r\n}\r\nfingerprint: {\r\n  'run_whatweb':
      true,\r\n  'run_cmseek': true\r\n}\r\nvulnerability_scan: {\r\n  'run_nuclei':
      true,\r\n  'enable_http_crawl': true,\r\n  'concurrency': 50,\r\n  'intensity':
      'normal',\r\n  'rate_limit': 150,\r\n  'retries': 1,\r\n  'timeout': 5,\r\n
      \ 'nuclei': {\r\n    'use_nuclei_config': false,\r\n    'severities': ['unknown',
      'info', 'low', 'medium', 'high', 'critical']\r\n  }\r\n}\r\nscreenshot: {\r\n
      \ 'enable_http_crawl': true,\r\n  'intensity': 'normal',\r\n  'timeout': 10,\r\n
      \ 'threads': 40\r\n}"
    default_engine: true
